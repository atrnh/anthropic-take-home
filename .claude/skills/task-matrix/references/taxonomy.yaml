products:
  - id: claude
    names: "claude.ai; claude desktop; claude app; web app; desktop app; browser; cowork"
    label: "Claude (claude.ai and Claude Desktop)"
    definition: "Claude on the web and Claude Desktop, including Cowork mode, treated as one product; the client or mode, when a page names it, goes in the record notes"
  - id: claude-desktop-3p
    names: "third-party inference; third party; bring your own; byo"
    label: "Claude Desktop on third-party inference"
    definition: "Claude Desktop deployed against a third-party inference provider, where IT registers and ships connectors for the organization."
  - id: claude-tag
    names: "claude tag; slack"
    label: "Claude Tag (Claude in Slack)"
    definition: "Claude working inside Slack channels, using personal connectors and an org skills repository."
  - id: claude-science
    names: "claude science"
    label: "Claude Science"
    definition: "The scientific research surface with Featured connectors, Featured skills, and per-project analysis."
  - id: claude-gov
    names: "claude for government; government; govcloud; fedramp"
    label: "Claude for Government"
    definition: "The Claude for Government deployment, covering both the member-facing Claude Desktop app and the admin portal Config page."
  - id: office-agents
    names: "microsoft 365; excel; powerpoint; word; outlook; office"
    label: "Claude for Microsoft 365 (Excel, PowerPoint, Word, Outlook)"
    definition: "The Office add-ins where connectors and skills enabled in Claude settings become available in the sidebar."
tasks:
  - id: T-001
    label: "browse the connectors directory"
    definition: "Find available prebuilt and community connectors in the Connectors Directory before adding one."
    aliases: "find a connector; browse available connectors; discover connectors"
    objects: "connector"
    outcome: "the reader has seen what the directory lists for a connector and how far Anthropic reviewed it; nothing is added, connected, or enabled"
    view: "product"
  - id: T-002
    label: "enable a directory connector"
    definition: "Turn on a prebuilt or directory-listed connector for your account and authenticate to the service."
    aliases: "connect a prebuilt connector; set up your first connector; turn on a Featured connector"
    objects: "connector"
    outcome: "a directory or Featured connector is connected to the user's account, authenticated to the third-party service, and available to use in this product"
    view: "product"
  - id: T-003
    label: "add a custom connector"
    definition: "Add a remote MCP server by URL through Settings > Connectors."
    aliases: "add a remote MCP server; add a third party connector; connect a custom MCP server"
    objects: "connector"
    outcome: "a remote MCP server the user supplied by URL is listed as a connector in this product and can be turned on in chats"
    view: "product"
  - id: T-004
    label: "add a local MCP server as a connector"
    definition: "Add an MCP server that runs as a local command on your own computer."
    aliases: "add a local command connector; configure a self-serve local MCP server"
    objects: "connector"
    outcome: "an MCP server running as a local command on the user's own machine is listed as a connector and its tools are reachable from this product"
    view: "product"
  - id: T-005
    label: "install a desktop extension (.mcpb)"
    definition: "Install a packaged MCP Bundle into Claude Desktop in one click."
    aliases: "install an MCPB; add a desktop extension"
    objects: "MCP bundle"
    outcome: "the .mcpb bundle is installed in the desktop app and the local server it packages runs and exposes its tools"
    view: "product"
  - id: T-006
    label: "authenticate a connector with request headers"
    definition: "Supply an API key or token to a custom connector by adding a request header instead of using OAuth."
    aliases: "add a request header; connect with an API key"
    objects: "connector"
    outcome: "the custom connector sends the user-supplied header on every request and authenticates to the server without an OAuth sign-in"
    view: "product"
  - id: T-007
    label: "use a connector in a chat or project"
    definition: "Turn a connector on for a specific conversation or project and ask Claude to use its tools."
    aliases: "enable connectors in chat; enable a connector in a project; use a connector in a conversation"
    objects: "connector"
    outcome: "an already-connected connector is switched on for this conversation or project, so Claude can call its tools while answering"
    view: "product"
  - id: T-008
    label: "approve connector tool use"
    definition: "Respond to Claude's permission card for a connector tool, choose the approval scope, and stop connector use when needed."
    aliases: "grant tool permission; approve a connector call; set approval scope; stop connector use; revoke an in-flight connector approval"
    objects: "connector"
    outcome: "the pending tool call runs or is refused at the scope the user chose on the permission card, and in-flight connector use can be stopped"
    view: "product"
  - id: T-009
    label: "review a connector result before it is shared"
    definition: "Inspect what Claude retrieved through your personal connector before it is posted where others can see it."
    aliases: "review results before posting"
    objects: "connector"
    outcome: "the user has seen the retrieved content privately and has decided whether it gets posted where other people in the channel can read it"
    view: "product"
  - id: T-010
    label: "manage installed connectors"
    definition: "View connection status, re-authenticate, reconnect a connector whose endpoint changed, and disconnect one you no longer want."
    aliases: "view connection status; manage connectors; reconnect after an endpoint change; disconnect a connector; remove a connector; turn off a connector"
    objects: "connector"
    outcome: "an existing connector's connection state has changed as intended: re-authenticated, reconnected at its new endpoint, turned off, or removed from the account"
    view: "product"
  - id: T-011
    label: "request a connector from an admin"
    definition: "Ask an organization administrator to add a directory connector on a Team or Enterprise plan."
    aliases: "request a connector on a Team plan"
    objects: "connector"
    outcome: "the request has reached the organization's administrator, who now decides whether to add the connector; the member has added nothing themselves"
    view: "product"
  - id: T-012
    label: "report a problem with a connector"
    definition: "Collect the reference ID and report a failing or misbehaving connector to Anthropic or the provider."
    aliases: "find your reference ID; report a connector issue; get help with a connector"
    objects: "connector"
    outcome: "a report carrying the reference ID and failure details has been filed with Anthropic or the connector's provider"
    view: "product"
  - id: T-013
    label: "troubleshoot connector sign-in"
    definition: "Diagnose an 'Authorization with the MCP server failed' or OAuth sign-in error when connecting."
    aliases: "fix connector authorization errors; troubleshoot OAuth sign-in; troubleshoot sign-in errors"
    objects: "connector"
    outcome: "the cause of the failed authorization is identified and sign-in completes, or the reader knows which party must change something"
    view: "product"
  - id: T-014
    label: "troubleshoot a connector that cannot reach the server"
    definition: "Diagnose \"Couldn't reach the MCP server\" — private IPs, firewalls, redirects, and failed OAuth discovery."
    aliases: "fix connection failures; troubleshoot an unreachable MCP server"
    objects: "connector"
    outcome: "the reason Claude cannot reach the server is identified (private IP, firewall, redirect, discovery) and the connector reaches it, or the blocking change is known"
    view: "product"
  - id: T-015
    label: "troubleshoot a connector tool call failure"
    definition: "Diagnose 'Unexpected error while invoking tool' and missing or failing tools on a connected server."
    aliases: "fix tool invocation errors; tools do not appear"
    objects: "connector"
    outcome: "a connected connector's tools appear and invoke successfully, or the reason a specific tool call fails is identified"
    view: "product"
  - id: T-016
    label: "connect Google Drive documents"
    definition: "Attach Google Docs to a chat or project by pasting URLs or picking recent files."
    aliases: "add Google Docs; connect Google Drive"
    objects: "connector"
    outcome: "the chosen Google Docs are attached to this chat or project and Claude can read their contents"
    view: "product"
  - id: T-017
    label: "connect Gmail or Google Calendar"
    definition: "Connect the Gmail or Google Calendar integration and ask Claude about your mail or schedule."
    aliases: "set up the Gmail integration; connect Google Calendar; set up the Calendar integration"
    objects: "connector"
    outcome: "the Gmail or Calendar integration is authorized for the account and Claude can answer questions from the user's mail or schedule"
    view: "product"
  - id: T-018
    label: "connect GitHub repositories"
    definition: "Add GitHub repositories, including private ones, to a chat or project."
    aliases: "add a repository; connect to GitHub; set up the GitHub connector"
    objects: "connector"
    outcome: "the named repositories, including private ones the user authorized, are available as context in this chat or project"
    view: "product"
  - id: T-019
    label: "set up the Microsoft 365 connector"
    definition: "Complete administrator consent and then user enablement so Claude can reach SharePoint, OneDrive, Outlook, and Teams."
    aliases: "connect Microsoft 365; register the M365 connector in Entra; enable M365 for users"
    objects: "connector"
    outcome: "the M365 connector is consented in the organization's Microsoft tenant and a signed-in user can query SharePoint, OneDrive, Outlook, and Teams from Claude"
    view: "product"
  - id: T-020
    label: "add Claude to a Slack workspace"
    definition: "Install the Claude Slack app for a workspace or for yourself as an individual user."
    aliases: "install Claude in Slack; add the Slack app"
    objects: "connector"
    outcome: "the Claude Slack app is installed for the workspace or the individual user, so Claude can be addressed from inside Slack"
    view: "product"
  - id: T-021
    label: "enable the Slack connector"
    definition: "Turn on the Slack connector so Claude can search your workspace from a Claude app."
    aliases: "connect Slack to Claude"
    objects: "connector"
    outcome: "the Slack connector is authorized in a Claude app, so Claude can search the user's Slack workspace from that app"
    view: "product"
  - id: T-022
    label: "allow or block connectors for an organization"
    definition: "As an admin, choose which directory, Featured, or custom connectors members may use."
    aliases: "add an org connector; turn off a Featured connector for everyone; allowlist a connector"
    objects: "connector"
    outcome: "the connector is on or off the organization's allowed list, so members can or cannot add and use it; no member's connector is connected by this step"
    view: "product"
  - id: T-023
    label: "set connector tool policies for members"
    definition: "As an admin, restrict which tools on an allowed connector members can invoke."
    aliases: "configure tool policies; control what Claude can do"
    objects: "connector"
    outcome: "an already-allowed connector exposes only the admin-selected subset of its tools to members, and tools outside the policy cannot be invoked"
    view: "product"
  - id: T-024
    label: "request access to MCP tunnels"
    definition: "Submit the interest form or contact the account team to get the MCP tunnels research preview enabled."
    aliases: "get MCP tunnels enabled"
    objects: "tunnel"
    outcome: "the request for the tunnels research preview has reached Anthropic; nothing is deployed and no tunnel exists yet"
    view: "product"
  - id: T-025
    label: "create a Tunnels API key"
    definition: "Generate the API key in claude.ai that the tunnel stack uses to register itself."
    aliases: "generate a tunnel API key"
    objects: "tunnel"
    outcome: "a Tunnels API key exists and has been captured, ready for a tunnel stack to authenticate its registration"
    view: "product"
  - id: T-026
    label: "deploy an MCP tunnel stack"
    definition: "Install the tunnel components with Helm or Docker Compose inside your network and verify the tunnel registers and connects."
    aliases: "install the tunnel with Helm; deploy with Docker Compose; set up an MCP tunnel; verify the tunnel connection"
    objects: "tunnel"
    outcome: "the tunnel components run inside the network, the tunnel is registered with Anthropic, and its connection is verified healthy"
    view: "product"
  - id: T-027
    label: "add a tunneled MCP server as a connector"
    definition: "Register an internal MCP server reached through the tunnel as a custom connector, and add more servers later."
    aliases: "add tunneled servers as connectors; route a server through the tunnel"
    objects: "tunnel"
    outcome: "an internal MCP server is reachable through the running tunnel as a custom connector and its tools appear in Claude"
    view: "product"
  - id: T-028
    label: "configure OAuth for an MCP tunnel"
    definition: "Fill in the Tunnel OAuth configuration fields, or publish split metadata, so sign-in works through the tunnel."
    aliases: "set the Tunnel OAuth configuration; route the authorization server through the tunnel; publish split metadata"
    objects: "tunnel"
    outcome: "users can complete OAuth sign-in to a tunneled server because its authorization endpoints resolve correctly through the tunnel"
    view: "product"
  - id: T-029
    label: "rotate MCP tunnel credentials"
    definition: "Replace the tunnel token and TLS certificates without breaking connected servers."
    aliases: "rotate the tunnel token; renew tunnel certificates"
    objects: "tunnel"
    outcome: "the tunnel runs on new token and certificate material and the servers behind it stay connected"
    view: "product"
  - id: T-030
    label: "remove an MCP tunnel"
    definition: "Tear down the tunnel stack and archive the tunnel in claude.ai."
    aliases: "delete a tunnel; archive a tunnel"
    objects: "tunnel"
    outcome: "the tunnel components no longer run and the tunnel is archived in claude.ai, freeing its slot"
    view: "product"
  - id: T-031
    label: "troubleshoot an MCP tunnel connection"
    definition: "Diagnose cloudflared, setup component, Helm hook, route, IP validation, and TLS failures in a tunnel deployment."
    aliases: "fix cloudflared connection errors; fix no route for host; fix TLS handshake failed; fix expired tunnel certificates"
    objects: "tunnel"
    outcome: "the deployment, routing, or certificate fault is identified and the tunnel connects and proxies to the upstream server"
    view: "product"
  - id: T-032
    label: "troubleshoot MCP tunnel OAuth sign-in"
    definition: "Fix sign-in that redirects to an unreachable tunnel address, token exchange failures, and a missing Tunnel OAuth toggle."
    aliases: "fix tunnel sign-in redirects; fix the Token endpoint field being rejected"
    objects: "tunnel"
    outcome: "sign-in through the tunnel completes end to end: the redirect resolves, token exchange succeeds, and the connector connects"
    view: "product"
  - id: T-033
    label: "install a plugin"
    definition: "Install a plugin from a marketplace listing or from a package file into the product."
    aliases: "add a plugin; upload a plugin file; install from the marketplace; install a plugin from a file"
    objects: "plugin"
    outcome: "the plugin is installed in this product and its components are available to the user"
    view: "product"
  - id: T-034
    label: "add a plugin marketplace"
    definition: "Register another marketplace, such as a Git repository, so its plugins can be installed."
    aliases: "use a Git repository as a marketplace; add a marketplace by URL; update a marketplace; add the financial services marketplace"
    objects: "plugin"
    outcome: "the marketplace is registered in this product and its plugins are offered for installation; no plugin is installed by this step"
    view: "product"
  - id: T-035
    label: "configure an installed plugin's components"
    definition: "Open an installed plugin and turn its skills, connectors, agents, slash commands, or hooks on or off."
    aliases: "review plugin components; enable or disable a plugin component"
    objects: "plugin"
    outcome: "the chosen components of an already-installed plugin are switched on or off, changing what the plugin contributes to Claude"
    view: "product"
  - id: T-036
    label: "update a plugin"
    definition: "Pull a newer version of an installed plugin from its marketplace or a replacement archive."
    aliases: "upgrade a plugin; replace a plugin archive"
    objects: "plugin"
    outcome: "the installed plugin runs at the newer version, replacing the previously installed contents"
    view: "product"
  - id: T-037
    label: "remove a plugin"
    definition: "Uninstall a plugin you installed, or remove one distributed to the organization."
    aliases: "uninstall a plugin; delete a plugin"
    objects: "plugin"
    outcome: "the plugin is no longer installed and its components have disappeared from the product"
    view: "product"
  - id: T-038
    label: "create a plugin with Claude"
    definition: "Have Claude build a plugin from a description and install the result."
    aliases: "Create with Claude; ask Claude to build a plugin"
    objects: "plugin"
    outcome: "a plugin generated from the user's description exists and is installed in this product"
    view: "product"
  - id: T-039
    label: "package a plugin archive"
    definition: "Lay out plugin.json and component folders and zip them into an uploadable plugin package."
    aliases: "build a plugin zip; prepare a plugin archive; wrap a skill in a plugin"
    objects: "plugin"
    outcome: "a plugin archive with a valid plugin.json and its component folders exists as a file, ready to upload or publish; it is not installed anywhere"
    view: "builder"
    artifact: "plugin"
    stage: "package"
  - id: T-040
    label: "add a plugin for an organization"
    definition: "As an admin, upload a plugin on the Plugins card and choose whether it auto-installs or members choose."
    aliases: "distribute a plugin to members; set plugin install behavior; require a plugin"
    objects: "plugin"
    outcome: "the plugin reaches the organization's members with the install behavior the admin chose (installed for everyone, or offered for members to install)"
    view: "product"
  - id: T-041
    label: "submit a plugin to the plugin directory"
    definition: "Prepare and submit a plugin for community or Anthropic Verified listing in the plugin directory."
    aliases: "publish a plugin; list a plugin in the directory"
    objects: "plugin"
    outcome: "the plugin has been filed for directory listing with the directory terms accepted, and awaits a listing decision"
    view: "builder"
    artifact: "plugin"
    stage: "submit"
  - id: T-042
    label: "find and enable a skill"
    definition: "See which skills are available in Settings and turn one on or off."
    aliases: "turn on a skill; browse Featured skills; enable a skill"
    objects: "skill"
    outcome: "a skill already present in this product is switched on (or off) for the account, so Claude will or will not load it; nothing has been run to check it"
    view: "product"
  - id: T-043
    label: "create a skill in the product"
    definition: "Make a new skill from inside the product's skills settings, by writing it there or having Claude build it from a description or a session."
    aliases: "Create with Claude; add a skill in Customize > Skills; save a workflow as a skill; write skill instructions in settings"
    objects: "skill"
    outcome: "a new skill exists in the user's skill list in this product and Claude can load it; nothing had to be authored or uploaded as a file"
    view: "product"
  - id: T-044
    label: "upload or import a skill"
    definition: "Add an existing skill to your account by uploading the file or importing it from a GitHub repository."
    aliases: "add a skill file; upload a .skill file; import from GitHub; add a GitHub token for skills"
    objects: "skill"
    outcome: "a skill authored elsewhere now appears in the user's skill list in this product, from an uploaded file or a connected repository"
    view: "product"
  - id: T-045
    label: "test a skill before distributing it"
    definition: "Exercise a skill package you authored against a task it should match, before uploading or handing it to anyone."
    aliases: "verify a skill loads; check a skill before uploading; try a skill locally"
    objects: "skill"
    outcome: "the author has given Claude a task the skill should match and confirmed the skill triggers and behaves as intended, before it is uploaded or distributed"
    view: "builder"
    artifact: "skill"
    stage: "test"
  - id: T-046
    label: "invoke a skill in a conversation"
    definition: "Insert a skill explicitly from the slash-command picker instead of waiting for automatic loading."
    aliases: "use a skill; run a skill with slash"
    objects: "skill"
    outcome: "the chosen skill is loaded into the current conversation on purpose and Claude follows it for this turn"
    view: "product"
  - id: T-047
    label: "manage your skills"
    definition: "Open a skill you created to rename, edit, or delete it."
    aliases: "rename a skill; delete a skill; edit a skill"
    objects: "skill"
    outcome: "an existing skill in the user's list has been renamed, edited, or deleted, and the change applies to later conversations"
    view: "product"
  - id: T-048
    label: "distribute skills to an organization"
    definition: "As an admin, make skills available to every member, by org skills settings or by bundling them in a plugin."
    aliases: "add organization skills; deliver skills to members"
    objects: "skill"
    outcome: "the skills appear for every member of the organization in this product without each member adding them"
    view: "product"
  - id: T-049
    label: "set up a skills repository with auto-sync"
    definition: "Put org skills in a git repository, enable auto-sync, and grant Claude write access."
    aliases: "connect a skills repo; enable skill auto-sync"
    objects: "skill"
    outcome: "the organization's skills come from a connected git repository, changes there propagate to members automatically, and Claude holds the write access needed to open pull requests"
    view: "product"
  - id: T-050
    label: "prompt Claude to propose skill updates"
    definition: "Ask Claude to open a pull request improving its own skills from what it learned in channels."
    aliases: "have Claude improve a skill; request a skill update PR"
    objects: "skill"
    outcome: "Claude has opened a pull request against the skills repository proposing changes, which a person still has to review and merge"
    view: "product"
  - id: T-051
    label: "build an MCP server"
    definition: "Set up a remote MCP server with a supported transport and the protocol features Claude uses."
    aliases: "get started building a connector; create an MCP server"
    objects: "MCP server"
    outcome: "an MCP server exists and serves its tools over a transport Claude supports, using the protocol features Claude consumes"
    view: "builder"
    artifact: "connector"
    stage: "build"
  - id: T-052
    label: "configure OAuth for an MCP server"
    definition: "Implement Claude's supported auth types, callback URLs, DCR or CIMD, per-customer URLs, and token refresh."
    aliases: "set up connector authentication; handle per-customer URLs; configure token refresh; register client credentials"
    objects: "MCP server"
    outcome: "the server's authorization flow works with Claude as the client: callbacks, client registration, per-customer URLs, and token refresh all succeed"
    view: "builder"
    artifact: "connector"
    stage: "build"
  - id: T-053
    label: "implement lazy authentication for an MCP server"
    definition: "Return 401 at the HTTP layer, serve discovery documents, and defer OAuth until a protected tool is called."
    aliases: "add mixed auth; add step-up authorization"
    objects: "MCP server"
    outcome: "unauthenticated clients can connect, list tools, and call public ones, and OAuth is demanded only when a protected tool is invoked"
    view: "builder"
    artifact: "connector"
    stage: "build"
  - id: T-054
    label: "support Enterprise Managed Auth"
    definition: "Accept enterprise SSO identity assertions so users connect without a separate OAuth consent step."
    aliases: "accept identity assertions; implement cross-app access"
    objects: "MCP server"
    outcome: "the server accepts identity assertions from an enterprise identity provider, so users connect without their own OAuth consent step"
    view: "builder"
    artifact: "connector"
    stage: "build"
  - id: T-055
    label: "package a local MCP server as an MCPB"
    definition: "Write manifest.json, add an icon and user configuration, and build a .mcpb bundle for Claude Desktop."
    aliases: "build a desktop extension; create an MCP bundle; write manifest.json"
    objects: "MCP bundle"
    outcome: "a .mcpb file with a valid manifest, icon, and user configuration exists and can be handed to users for one-click install"
    view: "builder"
    artifact: "connector"
    stage: "package"
  - id: T-056
    label: "test a connector against Claude"
    definition: "Add your server as a custom connector, test a local server, and validate it with MCP Inspector."
    aliases: "test your MCP server; validate with MCP Inspector; detect Claude as the client; debug a connector during development"
    objects: "MCP server"
    outcome: "the developer has exercised their own server from the real Claude client and from MCP Inspector and knows its tools behave correctly before submitting it"
    view: "builder"
    artifact: "connector"
    stage: "test"
  - id: T-057
    label: "prepare a connector for directory review"
    definition: "Work the pre-submission checklist for tool design, prompt-injection safety, assets, privacy policy, and test credentials."
    aliases: "pass the review criteria; prepare test credentials for review; meet submission requirements"
    objects: "listing"
    outcome: "the server, its assets, privacy policy, and reviewer test credentials satisfy the published review criteria; nothing has been filed yet"
    view: "builder"
    artifact: "connector"
    stage: "review"
  - id: T-058
    label: "submit a connector to the directory"
    definition: "File the connector through the submission portal and accept the directory terms."
    aliases: "list a connector; apply to the Connectors Directory"
    objects: "listing"
    outcome: "the submission has been filed through the portal with the directory terms accepted, and the connector is queued for review"
    view: "builder"
    artifact: "connector"
    stage: "submit"
  - id: T-059
    label: "use the submissions dashboard"
    definition: "Track a submission through review and read health, topline, error-breakdown, and usage metrics for a published connector."
    aliases: "access the submissions dashboard; check submission status; check connector metrics; read the error breakdown"
    objects: "listing"
    outcome: "the developer can see where a submission stands in review and read the health, usage, and error metrics of their published server"
    view: "builder"
    artifact: "connector"
    stage: "review"
  - id: T-060
    label: "edit a directory listing"
    definition: "Change the name, description, assets, or links on a published listing."
    aliases: "update your listing; change listing assets"
    objects: "listing"
    outcome: "the published listing shows the revised name, description, assets, or links; the server behind it is unchanged"
    view: "builder"
    artifact: "connector"
    stage: "maintain"
  - id: T-061
    label: "update a published MCP server"
    definition: "Deploy tool changes to a live listed server, and update the plugin that wraps it."
    aliases: "add or remove tools after publishing; update your plugin after publishing"
    objects: "listing"
    outcome: "the live listed server offers the changed tool surface on the next connection, and any plugin wrapping it has been updated to match"
    view: "builder"
    artifact: "connector"
    stage: "maintain"
  - id: T-062
    label: "delist a connector"
    definition: "Remove a published connector from the Connectors Directory."
    aliases: "unlist a connector; take down a listing"
    objects: "listing"
    outcome: "the connector no longer appears in the Connectors Directory and cannot be found or added from it"
    view: "builder"
    artifact: "connector"
    stage: "remove"
  - id: T-063
    label: "share a connector install link"
    definition: "Generate and distribute a link that adds your directory or custom connector for a user."
    aliases: "create an install link; distribute a custom connector by link"
    objects: "listing"
    outcome: "the developer holds a link they can send out that adds their connector for whoever opens it"
    view: "builder"
    artifact: "connector"
    stage: "distribute"
  - id: T-064
    label: "test an MCP App in Claude Desktop"
    definition: "Edit the desktop developer config, connect an example MCP App server, and see the widget render."
    aliases: "get started with MCP Apps; connect an example server; use developer tools for MCP Apps"
    objects: "MCP App"
    outcome: "an MCP App server is connected through the desktop developer config and its widget renders in a conversation where the developer can inspect it"
    view: "builder"
    artifact: "mcp-app"
    stage: "test"
  - id: T-065
