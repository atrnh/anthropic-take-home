name: Publish review previews

on:
  push:
    branches: [main]
    paths:
      - 2-standards/rewrite/build/page.html
      - 3-check/output/**
      - .github/pages/index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the landing page and both previews
        run: |
          mkdir -p _site/rewrite _site/review
          cp .github/pages/index.html _site/index.html
          cp 2-standards/rewrite/build/page.html _site/rewrite/index.html
          cp -R 3-check/output/. _site/review/
          mv _site/review/review.html _site/review/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
