# Publish the committed rewrite preview so reviewers can try it without a download.
name: Publish rewrite preview

on:
  push:
    branches: [main]
    paths:
      - 2-standards/rewrite/build/page.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the standalone page
        run: |
          mkdir _site
          cp 2-standards/rewrite/build/page.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
