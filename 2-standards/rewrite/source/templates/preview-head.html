<style>
  :root { color-scheme: light; font: 17px/1.65 system-ui, sans-serif; color: #252522; background: #faf9f6; }
  body { max-width: 800px; margin: 0 auto; padding: 48px 24px 100px; }
  h1 { font-size: 2.6rem; line-height: 1.15; letter-spacing: -.04em; }
  h2 { margin-top: 2.6rem; line-height: 1.3; }
  h3 { margin-top: 2rem; line-height: 1.4; }
  a { color: #245b74; text-underline-offset: .18em; }
  li { margin: .55rem 0; }
  select { font: inherit; max-width: 100%; padding: .65rem; border: 1px solid #888; border-radius: 4px; background: white; color: inherit; }
  label { display: block; font-weight: 650; margin-bottom: .4rem; }
  .chooser { position: sticky; top: 0; background: #faf9f6; padding: .7rem 0; z-index: 1; border-bottom: 1px solid #d6d1c9; }
  #selection-status { margin: .4rem 0 0; font-size: .9rem; }
  [id] { scroll-margin-top: 145px; }
  .help, .callout { border-left: 3px solid #b9ae9c; padding: 1px 20px; margin: 1.8rem 0; background: #f1eee7; }
  .help h2 { margin-top: 1rem; }
  .help p { padding-bottom: .3rem; }
  blockquote { margin-left: 0; padding-left: 1rem; border-left: 2px solid #aaa; }
  .variant { margin-top: 2rem; }
  :focus-visible { outline: 3px solid #245b74; outline-offset: 4px; }
  code { font-size: .9em; }
  [hidden] { display: none !important; }
  @media print { .chooser { display: none; } .variant[hidden] { display: block !important; } body { padding: 0; } }
</style>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const chooser = document.querySelector('.chooser');
  const select = document.querySelector('#instructions');
  const status = document.querySelector('#selection-status');
  const variants = [...document.querySelectorAll('.variant')];
  const ids = variants.map(section => section.id);
  const labels = Object.fromEntries([...select.options].map(option => [option.value, option.textContent]));
  const contextFromHash = () => [...ids].sort((a, b) => b.length - a.length).find(id => location.hash === '#' + id || location.hash.startsWith('#' + id + '-'));
  function render() {
    const requested = new URL(location.href).searchParams.get('instructions');
    const hashContext = contextFromHash();
    let selected = requested === null ? (hashContext || select.dataset.default) : requested;
    let message = '';
    if (![...ids, '', 'all'].includes(selected)) {
      selected = '';
      message = 'This link names an unknown guide. Use “Which guide should I use?”, then choose your instructions.';
    } else if (ids.includes(selected) && hashContext && selected !== hashContext) {
      selected = '';
      message = 'This link names two different guides. Use “Which guide should I use?”, then choose your instructions.';
    }
    select.value = selected;
    variants.forEach(section => { section.hidden = selected !== 'all' && section.id !== selected; });
    status.textContent = message || (selected === 'all' ? 'Showing all labeled guides.' : selected ? 'Showing ' + labels[selected] + '.' : 'Use “Which guide should I use?” above, then choose a guide.');
    if (hashContext && (selected === hashContext || selected === 'all')) {
      document.getElementById(location.hash.slice(1))?.scrollIntoView();
    }
  }
  select.addEventListener('change', () => {
    const url = new URL(location.href);
    url.searchParams.set('instructions', select.value);
    const hashContext = contextFromHash();
    if (hashContext && select.value !== 'all' && hashContext !== select.value) url.hash = '';
    history.pushState(null, '', url);
    render();
  });
  window.addEventListener('popstate', render);
  window.addEventListener('hashchange', render);
  chooser.hidden = false;
  render();
});
</script>
